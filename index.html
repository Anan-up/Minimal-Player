<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简播放器</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#111111;
    --muted:#9aa0a6;
    --line:#ececec;
    --fill:#111111;
    --track:#ededed;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .app{
    width:100%;
    max-width:760px;
    background:var(--bg);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    font-size:15px;
    font-weight:600;
    letter-spacing:.5px;
  }
  .brand .dot{color:var(--muted);font-weight:400;margin-left:6px}
  .filelabel{
    font-size:13px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    cursor:pointer;
    transition:border-color .15s,color .15s;
    user-select:none;
    white-space:nowrap;
  }
  .filelabel:hover{border-color:#cfcfcf;color:var(--fg)}

  /* 拖拽区 / 舞台 */
  .stage{
    position:relative;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg);
    overflow:hidden;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage.drag{outline:2px dashed #111;outline-offset:-8px}
  .stage.full{border:none;border-radius:0}
  .stage.full video{width:100%;height:100%;border-radius:0}
  video{width:100%;height:100%;display:block;background:#000;border-radius:var(--radius);object-fit:contain}
  #spectrum{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
  .placeholder{
    text-align:center;
    color:var(--muted);
    padding:30px;
    user-select:none;
  }
  .placeholder svg{display:block;margin:0 auto 14px;opacity:.5}
  .placeholder .hint{font-size:13px;line-height:1.7}
  .placeholder .big{font-size:15px;color:var(--fg);margin-bottom:6px}
  .hidden{display:none!important}

  /* 波形 */
  .wavewrap{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .wavewrap .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);gap:10px}
  .wavewrap .name{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);flex:0 0 auto}
  canvas{display:block;width:100%;height:88px;cursor:pointer}

  /* 控制条 */
  .controls{margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .btn{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--fg);transition:background .15s,border-color .15s;
    flex:0 0 auto;
  }
  .btn:hover{border-color:#cfcfcf}
  .btn:active{background:#f6f6f6;transform:scale(.92)}
  .btn.on{background:#111;border-color:#111;color:#fff}
  .btn svg{display:block}
  @keyframes pop{0%{transform:scale(.85)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
  .play-btn.pop{animation:pop .22s ease}
  .play-btn{width:50px;height:50px}

  .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:96px;text-align:center}
  .time b{color:var(--fg);font-weight:500}

  .volume{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .vol-slider{width:84px}
  /* 增强面板展开/收起动画 */
  #boostPanel{display:flex;align-items:center;gap:8px;max-height:60px;max-width:240px;opacity:1;overflow:hidden;transition:max-height .22s ease,max-width .22s ease,opacity .22s ease}
  #boostPanel.collapsed{max-height:0;max-width:0;opacity:0;pointer-events:none}
  /* 静音时隐藏（带过渡） */
  .anim-hide{opacity:0!important;max-width:0!important;margin:0!important;pointer-events:none!important;overflow:hidden;transition:opacity .2s ease,max-width .2s ease,margin .2s ease}

  .spacer{flex:1 1 auto}

  .speed{position:relative;flex:0 0 auto}
  .speed button{
    font-size:12px;color:var(--fg);border:1px solid var(--line);background:var(--bg);
    border-radius:999px;padding:8px 14px;cursor:pointer;min-width:58px;
  }
  .speed button:hover{border-color:#cfcfcf}
  .speed .menu{
    position:absolute;bottom:48px;right:0;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;min-width:80px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
  }
  .speed .menu.open{display:flex}
  .speed .menu div{padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--fg);text-align:center}
  .speed .menu div:hover{background:#f6f6f6}
  .speed .menu div.active{font-weight:600}

  /* 滑块统一样式 */
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:3px;border-radius:999px;
    background:var(--track);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--fill);border:none;transition:transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fill);border:none}

  .disabled{opacity:.35;pointer-events:none}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">极简播放器<span class="dot">/ Minimal Player</span></div>
    <label class="filelabel" for="file">+ 选择文件</label>
    <input id="file" type="file" accept="video/*,audio/*" hidden>
  </div>

  <div class="stage" id="stage">
    <video id="video" class="hidden" playsinline></video>
    <canvas id="spectrum" class="hidden"></canvas>
    <div class="placeholder" id="placeholder">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <div class="big">拖入或选择本地媒体</div>
      <div class="hint">支持 MP4 / WebM / MOV 等视频<br>以及 MP3 / WAV / FLAC / M4A 等音频</div>
    </div>
  </div>

  <div class="wavewrap hidden" id="wavewrap">
    <div class="meta">
      <span class="name" id="wname">—</span>
      <span class="badge" id="wbadge">—</span>
    </div>
    <canvas id="wave"></canvas>
  </div>

  <div class="controls disabled" id="controls">
    <button class="btn play-btn" id="playBtn" title="播放/暂停">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="time"><b id="cur">0:00</b> / <span id="dur">0:00</span></div>

    <div class="volume">
      <button class="btn" id="muteBtn" title="静音" style="width:36px;height:36px">
        <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <input type="range" class="vol-slider" id="vol" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="volume" id="boostGroup" title="音量增强开关：打开后显示倍率滑块">
      <button class="btn" id="boostToggle" title="音量增强：关" style="width:36px;height:36px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9v6h4l5 5V4L8 9H4z" stroke="none"/><path d="M16 9.5a4 4 0 010 5" fill="none"/><path d="M19 11v2" fill="none"/></svg>
      </button>
      <div id="boostPanel" class="collapsed" style="display:flex;align-items:center;gap:8px">
        <input type="range" class="vol-slider" id="boost" min="1" max="10" step="0.1" value="1">
        <span id="boostVal" style="font-size:11px;color:var(--muted);min-width:30px;text-align:left">1.0×</span>
        <button class="btn on" id="limiterToggle" title="限制器：开" style="width:36px;height:36px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 17l3-5 3 4 3-7 3 5"/></svg>
        </button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="speed">
      <button id="speedBtn">1.0×</button>
      <div class="menu" id="speedMenu">
        <div data-s="0.5">0.5×</div>
        <div data-s="0.75">0.75×</div>
        <div data-s="1" class="active">1.0×</div>
        <div data-s="1.25">1.25×</div>
        <div data-s="1.5">1.5×</div>
        <div data-s="2">2.0×</div>
        <div data-s="3">3.0×</div>
      </div>
    </div>

    <button class="btn" id="fsBtn" title="全屏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="foot">所有文件仅在本地浏览器中处理，不会上传任何服务器。</div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fileInput = $('file'), stage = $('stage'), video = $('video'),
        placeholder = $('placeholder'), wavewrap = $('wavewrap'),
        wname = $('wname'), wbadge = $('wbadge'), wave = $('wave'),
        controls = $('controls'), playBtn = $('playBtn'), playIcon = $('playIcon'),
        curEl = $('cur'), durEl = $('dur'), vol = $('vol'), muteBtn = $('muteBtn'),
        volIcon = $('volIcon'), speedBtn = $('speedBtn'), speedMenu = $('speedMenu'),
        fsBtn = $('fsBtn'), spectrum = $('spectrum'), sctx = spectrum.getContext('2d'),
        boostSlider = $('boost'), boostVal = $('boostVal'), boostToggle = $('boostToggle'),
        boostPanel = $('boostPanel'), boostGroup = $('boostGroup'), limiterToggle = $('limiterToggle');

  const ctx2d = wave.getContext('2d');
  let peaks = null;          // Float32Array 波形峰值
  let objectUrl = null;
  let isVideo = false;
  let loadToken = 0;         // 加载序号：用于丢弃过期文件的异步解码结果

  // 实时频谱所需
  let audioCtx = null, analyser = null, srcNode = null, freqData = null, barPeaks = null, gainNode = null, limiterNode = null;
  let rafId = null, spectrumMode = false, boost = 1, boostOn = false, limiterOn = true;
  let speed = 1;             // 倍速：video.load() 会把 playbackRate 重置回 defaultPlaybackRate

  /* ---------- 文件处理 ---------- */
  fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });

  ['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e=>{
    e.preventDefault(); stage.classList.add('drag');
  }));
  stage.addEventListener('dragleave', e=>{
    e.preventDefault();
    // 在舞台内部元素之间移动同样会触发 dragleave，需判断是否真的离开了舞台
    if(!stage.contains(e.relatedTarget)) stage.classList.remove('drag');
  });
  stage.addEventListener('drop', e=>{
    e.preventDefault(); stage.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if(f) loadFile(f);
  });
  // 拖到舞台以外时阻止浏览器直接打开该文件（否则整个页面会被替换掉）
  ['dragover','drop'].forEach(ev => document.addEventListener(ev, e=>{
    if(!stage.contains(e.target)) e.preventDefault();
  }));

  const AUDIO_EXT = /\.(mp3|wav|wave|flac|m4a|aac|ogg|oga|opus|wma|aif|aiff|alac|ape)$/i;
  const VIDEO_EXT = /\.(mp4|m4v|webm|mov|mkv|avi|flv|wmv|mpe?g|ts|m2ts|3gp|3g2|ogv|rmvb|vob)$/i;
  // .mkv 等格式浏览器给不出 MIME，必须回退到扩展名，否则视频会被当成音频隐藏掉画面
  function detectVideo(file){
    const type = (file.type || '').toLowerCase();
    if(type.startsWith('video')) return true;
    if(type.startsWith('audio')) return false;
    const name = file.name || '';
    if(AUDIO_EXT.test(name)) return false;
    if(VIDEO_EXT.test(name)) return true;
    return false;                                           // 未知类型按音频处理（至少有声音）
  }
  function kindLabel(file){
    const sub = (file.type || '').split('/')[1];
    if(sub) return sub.toUpperCase();
    const ext = (file.name.match(/\.[^.]+$/) || [''])[0].replace('.','');
    return ext ? ext.toUpperCase() : '未知';
  }

  function loadFile(file){
    const token = ++loadToken;                              // 让更早的解码任务作废
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    spectrumMode = false;
    if(barPeaks) barPeaks.fill(0);
    if(objectUrl){ URL.revokeObjectURL(objectUrl); }
    objectUrl = URL.createObjectURL(file);
    isVideo = detectVideo(file);

    video.classList.toggle('hidden', !isVideo);
    placeholder.classList.add('hidden');                    // 已载入文件：空状态提示会与音频频谱叠在一起
    spectrum.classList.toggle('hidden', isVideo);           // 音频：舞台显示柱状频谱
    video.src = objectUrl;

    wname.textContent = file.name;
    wbadge.textContent = (isVideo ? '视频' : '音频') + ' · ' + kindLabel(file);
    wavewrap.classList.remove('hidden');
    controls.classList.remove('disabled');

    video.load();
    video.defaultPlaybackRate = speed;                      // load() 会把 playbackRate 重置为 defaultPlaybackRate
    video.playbackRate = speed;
    curEl.textContent = '0:00';                             // 清掉上一个文件残留的进度显示
    durEl.textContent = '0:00';
    if(!isVideo) drawSpectrum();                            // 先画静态空闲频谱
    buildWaveform(file, token);
  }

  /* ---------- 波形计算 ---------- */
  async function buildWaveform(file, token){
    peaks = null;
    drawWave(0);
    let ac = null;
    try{
      const buf = await file.arrayBuffer();
      if(token !== loadToken) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();
      const decoded = await ac.decodeAudioData(buf);
      if(token !== loadToken) return;                       // 期间又换了文件，丢弃本次结果
      peaks = computePeaks(decoded, 160);                   // 只保留 160 个峰值
      drawWave(video.currentTime || 0);                     // decoded 随作用域释放（3 分钟音频约 66MB）
    }catch(err){
      // 解码失败（如部分视频容器音频不可读）则跳过波形
      if(token !== loadToken) return;
      peaks = null;
      drawWave(0);
    }finally{
      // 必须关闭：解码失败时提前 return 会漏掉 close，累积后新建 AudioContext 会失败
      if(ac){ try { ac.close(); } catch(e){} ac = null; }
    }
  }

  function computePeaks(audioBuffer, buckets){
    // 合并所有声道：只读 0 声道时，左声道为空的文件会被画成一条直线
    const chans = [];
    for(let c=0;c<audioBuffer.numberOfChannels;c++) chans.push(audioBuffer.getChannelData(c));
    const block = Math.floor(chans[0].length / buckets) || 1;
    const out = new Float32Array(buckets);
    let max = 0;
    for(let i=0;i<buckets;i++){
      let peak = 0;
      const start = i*block;
      for(let j=0;j<block;j++){
        for(let c=0;c<chans.length;c++){
          const v = Math.abs(chans[c][start+j] || 0);
          if(v > peak) peak = v;
        }
      }
      out[i] = peak;
      if(peak > max) max = peak;
    }
    if(max > 0){ for(let i=0;i<buckets;i++) out[i] /= max; }
    return out;
  }

  // 画布宽度不够时自动合并柱子：保证柱宽 >= 2px，否则会算出负宽度让 arcTo 抛 IndexSizeError
  function fitBars(total, width, gap){
    return Math.max(1, Math.min(total, Math.floor((width + gap) / (gap + 2))));
  }

  function drawWave(progress){
    const w = wave.clientWidth, h = wave.clientHeight;
    if(wave.width !== w*devicePixelRatio || wave.height !== h*devicePixelRatio){
      wave.width = w*devicePixelRatio; wave.height = h*devicePixelRatio;
    }
    ctx2d.clearRect(0,0,wave.width,wave.height);
    if(!wave.width || !wave.height) return;
    const mid = wave.height/2;
    const dpr = devicePixelRatio;
    const total = peaks ? peaks.length : 80;
    const gap = 2*dpr;
    const n = fitBars(total, wave.width, gap);
    const barW = (wave.width - gap*(n-1)) / n;

    for(let i=0;i<n;i++){
      const amp = peaks ? peaks[Math.floor(i*total/n)] : 0.12 + 0.1*Math.abs(Math.sin(i));
      const barH = Math.max(2*dpr, amp*(wave.height*0.9));
      const x = i*(barW+gap);
      const played = peaks ? (i/n) <= (progress||0) : false;
      ctx2d.fillStyle = played ? '#111111' : '#e2e2e2';
      roundRect(ctx2d, x, mid-barH/2, barW, barH, barW/2);
      ctx2d.fill();
    }
  }

  /* ---------- 实时柱状频谱（绘制在舞台区域） ---------- */
  function ensureAudioGraph(){
    if(srcNode) return;                       // MediaElementSource 每个元素只能建一次
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    srcNode = audioCtx.createMediaElementSource(video);
    // 音量增强：增益节点 + 限制器，避免过载削波
    gainNode = audioCtx.createGain();
    gainNode.gain.value = boostOn ? boost : 1;
    const limiter = audioCtx.createDynamicsCompressor();
    limiterNode = limiter;
    limiter.threshold.value = -1;    // -6dB 会让 1.0× 正常播放也被持续压缩，改为只削峰
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;                   // 128 个频点
    analyser.smoothingTimeConstant = 0.9;      // 提高平滑，减少抖动
    freqData = new Uint8Array(analyser.frequencyBinCount);
    barPeaks = new Float32Array(analyser.frequencyBinCount);
    srcNode.connect(gainNode);
    limiterNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    applyLimiter();                          // 按 limiterOn 决定增益后是接限制器还是直连
  }

  // 限制器开关：开 → 增益接压缩器；关 → 增益直连（旁路限制器）
  function applyLimiter(){
    try { gainNode.disconnect(); } catch(e){}
    if(limiterOn) gainNode.connect(limiterNode);
    else gainNode.connect(analyser);
  }

  function sizeCanvas(cv){
    const w = cv.clientWidth, h = cv.clientHeight;
    if(cv.width !== w*devicePixelRatio || cv.height !== h*devicePixelRatio){
      cv.width = w*devicePixelRatio; cv.height = h*devicePixelRatio;
    }
  }

  // 频谱画在舞台的 #spectrum 画布上；播放时为实时数据，空闲/暂停时为静态低幅波形
  function drawSpectrum(){
    sizeCanvas(spectrum);
    const w = spectrum.width, h = spectrum.height, dpr = devicePixelRatio;
    sctx.clearRect(0,0,w,h);
    if(!w || !h) return;
    const total = analyser ? analyser.frequencyBinCount : 128;
    const gap = 2*dpr;
    const bins = fitBars(total, w, gap);
    const barW = (w - gap*(bins-1)) / bins;
    const live = spectrumMode && analyser;
    for(let i=0;i<bins;i++){
      const v = live ? barPeaks[Math.floor(i*total/bins)] : (0.06 + 0.05*Math.abs(Math.sin(i*0.5)));
      const barH = Math.max(2*dpr, v * h * 0.45);
      const x = i*(barW+gap);
      sctx.fillStyle = '#111111';
      roundRect(sctx, x, h-barH, barW, barH, barW/2);
      sctx.fill();
    }
  }

  function spectrumLoop(){
    rafId = null;                                       // 先清空：否则绘制抛错后 rafId 非空，循环再也无法重启
    if(!spectrumMode || !analyser || video.paused) return;
    try{
      analyser.getByteFrequencyData(freqData);
      const n = freqData.length;
      for(let i=0;i<n;i++){
        const t = freqData[i]/255;
        if(t > barPeaks[i]) barPeaks[i] = t;            // 快速上升
        else barPeaks[i] = barPeaks[i]*0.88 + t*0.12;   // 缓慢回落，抑制抖动
      }
      drawSpectrum();
    }catch(err){
      // 单帧绘制失败不应中断整个动画循环
    }
    rafId = requestAnimationFrame(spectrumLoop);
  }
  function startSpectrum(){
    spectrumMode = true;
    if(!rafId) rafId = requestAnimationFrame(spectrumLoop);
  }
  function stopSpectrum(){
    spectrumMode = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    drawSpectrum();                          // 回到静态低幅波形
    if(peaks) drawWave(video.currentTime/video.duration);
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    if(!(w > 0) || !(h > 0)) return;                   // 退化尺寸：跳过，arcTo 不接受负半径
    r = Math.max(0, Math.min(r, w/2, h/2));
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  wave.addEventListener('click', e=>{
    if(!peaks || !isFinite(video.duration) || video.duration <= 0) return;
    const rect = wave.getBoundingClientRect();
    if(!rect.width) return;
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left)/rect.width));
    video.currentTime = ratio * video.duration;
  });

  /* ---------- 播放控制 ---------- */
  function togglePlay(){
    if(!video.paused){ video.pause(); return; }
    const p = video.play();
    // 不支持的编码/容器会让 play() 返回被拒绝的 Promise，不接住就是未捕获拒绝
    if(p && p.catch) p.catch(err => console.warn('播放失败：', err && err.name, err && err.message));
  }
  playBtn.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('play', ()=>{
    setPlayIcon(true);
    try{
      ensureAudioGraph();              // 音频/视频都接入音频图（含增益增强）
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }catch(err){
      console.warn('音频图初始化失败，降级为直通播放：', err);
    }
    if(!isVideo && analyser) startSpectrum();   // 仅音频显示实时柱状频谱
  });
  video.addEventListener('pause', ()=>{
    setPlayIcon(false);
    if(!isVideo) stopSpectrum();
  });
  video.addEventListener('ended', ()=>{
    setPlayIcon(false);
    if(!isVideo) stopSpectrum();
  });
  function setPlayIcon(playing){
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    playBtn.classList.remove('pop');
    void playBtn.offsetWidth;            // 重置动画，重新触发
    playBtn.classList.add('pop');
  }

  function fmt(t){
    if(!isFinite(t)) return '0:00';
    t = Math.floor(t);
    const m = Math.floor(t/60), s = t%60;
    return m + ':' + String(s).padStart(2,'0');
  }
  video.addEventListener('loadedmetadata', ()=> durEl.textContent = fmt(video.duration));
  video.addEventListener('timeupdate', ()=>{
    curEl.textContent = fmt(video.currentTime);
    if(peaks) drawWave(video.currentTime/video.duration);   // 波形区始终显示带进度的音轨波形
  });

  /* ---------- 音量 ---------- */
  vol.addEventListener('input', ()=>{
    video.volume = parseFloat(vol.value);
    if(video.volume > 0) video.muted = false;   // 音量>0 取消静音；拖到 0 仅静音不隐藏控件
    updateVolIcon();
  });
  muteBtn.addEventListener('click', ()=>{
    video.muted = !video.muted;
    if(!video.muted && video.volume === 0){ video.volume = 1; vol.value = 1; }
    updateVolIcon();
  });
  function updateVolIcon(){
    const v = video.muted ? 0 : video.volume;
    volIcon.innerHTML = v === 0
      ? '<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l5 5M21 9l-5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
      : (v < 0.5
        ? '<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 10a3 3 0 010 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>');
    applyMuteUI();
  }
  // 仅“静音按钮”触发隐藏：音量滑块 + 整个增强组（开关、倍率滑块、限制器开关）；音量拖到 0 不隐藏
  function applyMuteUI(){
    const m = video.muted;
    vol.classList.toggle('anim-hide', m);
    boostGroup.classList.toggle('anim-hide', m);
  }

  /* ---------- 音量增强 ---------- */
  boostSlider.addEventListener('input', ()=>{
    boost = parseFloat(boostSlider.value);
    boostVal.textContent = boost.toFixed(1) + '×';
    if(boostOn && gainNode) gainNode.gain.value = boost;   // 仅开启时实时生效
  });
  boostToggle.addEventListener('click', ()=>{
    boostOn = !boostOn;
    boostPanel.classList.toggle('collapsed', !boostOn);
    boostToggle.classList.toggle('on', boostOn);
    boostToggle.title = '音量增强：' + (boostOn ? '开' : '关');
    if(gainNode) gainNode.gain.value = boostOn ? boost : 1;
  });
  limiterToggle.addEventListener('click', ()=>{
    limiterOn = !limiterOn;
    limiterToggle.classList.toggle('on', limiterOn);
    limiterToggle.title = '限制器：' + (limiterOn ? '开' : '关');
    if(gainNode) applyLimiter();
  });

  /* ---------- 倍速 ---------- */
  speedBtn.addEventListener('click', e=>{ e.stopPropagation(); speedMenu.classList.toggle('open'); });
  speedMenu.querySelectorAll('div').forEach(item=>{
    item.addEventListener('click', ()=>{
      const s = parseFloat(item.dataset.s);
      speed = s;
      video.defaultPlaybackRate = s;   // 换文件后 load() 会按这个值恢复倍速
      video.playbackRate = s;
      speedBtn.textContent = (Number.isInteger(s) ? s.toFixed(1) : s.toFixed(2)) + '×';
      speedMenu.querySelectorAll('div').forEach(d=>d.classList.remove('active'));
      item.classList.add('active');
      speedMenu.classList.remove('open');
    });
  });
  document.addEventListener('click', ()=> speedMenu.classList.remove('open'));

  /* ---------- 全屏 ---------- */
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  fsBtn.addEventListener('click', ()=>{
    if(!fsElement()){
      const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      if(!req) return;
      const p = req.call(stage);
      if(p && p.catch) p.catch(err => console.warn('进入全屏失败：', err));
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(!exit) return;
      const p = exit.call(document);
      if(p && p.catch) p.catch(()=>{});
    }
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, ()=>{
    const fs = !!fsElement();
    stage.classList.toggle('full', fs);
    stage.style.aspectRatio = fs ? 'auto' : '16/9';
    if(!spectrum.classList.contains('hidden')) drawSpectrum();
  }));

  /* ---------- 自适应重绘 ---------- */
  window.addEventListener('resize', ()=>{
    if(!wavewrap.classList.contains('hidden')) drawWave(peaks ? video.currentTime/video.duration : 0);
    if(!spectrum.classList.contains('hidden')) drawSpectrum();
  });
})();
</script>
</body>
</html>
